[project]
name = "reservas"
version = "0.3.0"
description = "API pequeña de reservas de salas"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pyotp>=2.10.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
